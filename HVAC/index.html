const DATA=[{"n": 1, "q": "Điều kiện cần thiết để các vùng không gian trong các công trình xây dựng được xem là có thông gió tự nhiên nếu các lỗ thông gió, cửa sổ có thể mở được ra bên ngoài với diện tích không nhỏ hơn bao nhiêu % diện tích sàn ?", "opts": ["5%", "10%", "15%", "20%"], "correct": 0}, {"n": 2, "q": "Lưu lượng nước lạnh cấp cho bộ xử lý không khí AHU trong hệ thống điều hòa không khí được khống chế bởi bộ phận nào ?", "opts": ["Bộ điều khiển kỹ thuật số DDC;", "Van gió điện điều khiển vô cấp;", "Van nước điện điều khiển vô cấp;", "Tất cả các bộ phận trên."], "correct": 2}, {"n": 3, "q": "Tại sao các van gió điện lại được lắp trên các đường gió ngoài và gió hồi trước khi nối vào AHU trong các hệ thống điều hòa không khí lớn ?", "opts": ["Để ngăn bụi truyền vào trong phòng;", "Để dừng hệ thống điều hòa không khí về đêm;", "Để mở hoàn toàn khi có cháy xảy ra;", "Để điều chỉnh lưu lượng gió ngoài theo nhu cầu."], "correct": 3}, {"n": 4, "q": "Nhận định nào sau đây về chu trình lạnh là đúng ?", "opts": ["Hơi tác nhân lạnh ngưng tụ ở 20°C để thải nhiệt từ trong nhà ra ngoài môi trường;", "Dịch tác nhân lạnh bay hơi ở 30°C để thu nhiệt từ bên trong nhà;", "Van tiết lưu làm tăng áp suất hơi tác nhân lạnh;", "Nhiệt thừa trong nhà được hấp thụ bởi tác nhân lạnh bay hơi ở áp suất thấp và nhiệt độ khoảng 5°C nhiệt độ."], "correct": 3}, {"n": 5, "q": "Mục đích sử dụng biểu đồ l-d trong tính toán thiết kế hệ thống thông gió và điều hòa không khí là gì ?", "opts": ["Biểu diễn sự thay đổi nhiệt độ khí truyền qua tường;", "Tính toán nhu cầu nhiệt ẩn;", "Tính toán nhu cầu nhiệt hiện;", "Biểu diễn các thông số vật lý của không khí ẩm."], "correct": 3}, {"n": 6, "q": "Khi hút khói trực tiếp từ các gian phòng có diện tích lớn hơn 3000 m2, diện tích vùng khói được quy định có diện tích không lớn hơn bao nhiêu ?", "opts": ["1000 m2;", "1600 m2;", "2500 m2;", "3000 m2."], "correct": 3}, {"n": 7, "q": "Bội số trao đổi không khí khi hệ thống thông gió cho gara ô tô ngầm của nhà  "correct": 0}, {"n": 16, "q": "Tiêu chuẩn Việt Nam TCVN 5687:2024 được áp dụng khi thiết kế là lắp đặt các hệ thống thông gió - điều hòa không khí cho đối tượng nào ?", "opts": ["Các công trình hầm trú ẩn; hầm mỏ;", "Các hệ thống thiết bị công nghệ và thiết bị điện;", "Các hệ thống sưởi ấm trung tâm bằng nước nóng hoặc hơi nước;", "Các công trình kiến trúc nhà ở, công trình công cộng và công trình công nghiệp."], "correct": 3}, {"n": 17, "q": "Những phòng nào sau đây không yêu cầu thông gió hút khói ?", "opts": ["Các hành lang hoặc sảnh, khi các gian phòng có cửa đi vào hành lang hoặc sảnh này đã được thoát khỏi trực tiếp;", "Các sảnh thông tầng của nhà có chiều cao lớn hơn 28 m;", "Các sảnh thông tầng có chiều cao lớn hơn 15 m;", "Tất cả các trường hợp trên."], "correct": 0}, {"n": 18, "q": "Giải pháp nào sau đây áp dụng cho hệ thống thông gió - điều hòa không khí là tiết kiệm năng lượng nhất ?", "opts": ["Tuần hoàn gió cấp;", "Sử dụng bánh xe hồi nhiệt để tận thu nhiệt từ gió thải;", "Sử dụng thiết bị hồi nhiệt dạng tấm để tận thu nhiệt từ gió thải;", "Sử dụng thiết bị hồi nhiệt dạng ống để tận thu nhiệt từ gió thải."], "correct": 0}, {"n": 19, "q": "Thông số tính toán của không khí ngoài trời dùng để thiết kế Điều hòa không khí theo cấp I có số giờ cho phép không đảm bảo chế độ nhiệt ẩm bên trong nhà là bao nhiêu ?", "opts": ["m = 25 h/năm", "m = 30 h/năm", "m = 35 h/năm", "m = 40 h/năm"], "correct": 2}, {"n": 20, "q": "Thông số tính toán của không khí ngoài trời dùng để thiết kế Điều hòa không khí theo cấp II có số giờ cho phép không đảm bảo chế độ nhiệt ẩm bên trong nhà là bao nhiêu ?", "opts": ["m = 125 - 150 h/năm", "m = 150 - 200 h/năm", "m = 200 - 250 h/năm", "m = 250 - 300 h/năm"], "correct": 1}, {"n": 21, "q": "Cần tổ chức thông gió với áp suất dư dương cho các phòng nào ?", "opts": ["Phòng sản xuất thuộc cấp nguy hiểm cháy nổ A và B", "Phòng có tỏa mùi khó chịu", "Phòng sản xuất tỏa hơi khí độc hại", "Phòng “sạch”"], "correct": 3}, {"n": 22, "q": "Đường ống gió có tiết diện hình gì được ưu tiên lựa chọn khi thiết kế và thi công ?", "opts": ["Hình tròn", "Hình vuông", "Hình chữ nhật", "Hình tam giác"], "correct": 0}, {"n": 23, "q": "Đường ống gió bằng vật liệu không cháy phải được sử dụng cho trường hợp nào ?", "opts": ["Các hệ thống hút thải cục bộ hút thải hỗn hợp nguy hiểm cháy nổ", "Các tuyến ống ngang qua hoặc ống góp thuộc hệ thống TG-ĐHKK trong nhà ở", "Các tuyến ống ngang hoặc ống góp thuộc hệ thống TG-ĐHKK trong nhà công cộng", "Tất cả các trường hợp trên"], "correct": 3}, {"n": 24, "q": "Nhiệt dung riêng của không khí khô là bao nhiêu ?", "opts": ["1,205 kJ/kg", "1,005 kJ/kg°K", "4,186 kJ/kg", "4,2 KJ/kg°K"], "correct": 1}, {"n": 25, "q": "Khối lượng riêng của không khí ẩm là bao nhiêu ?", "opts": ["4,186 kg/m3 ở 25°C, 760 mmHg", "1,013 kg/m3 ở 20°C, ở mực nước biển", "1,205 kg/m3 ở 20°C, 760 mmHg", "0,803 m3/kg"], "correct": 2}, {"n": 26, "q": "Chỉ số hiệu quả COP tối thiểu của máy chiller xoắn ốc hoặc trục vít chạy điện giải nhiệt bằng nước có năng suất lạnh ≥ 1055 kW là bao nhiêu ?", "opts": ["4,45", "4,9", "5,67", "6,0"], "correct": 2}, {"n": 27, "q": "Biện pháp phù hợp nhất để giảm tiếng ồn liên quan đến đường ống gió ?", "opts": ["Các đường ống gió được lắp đặt trên các lò xo giảm chấn", "Quạt và động cơ được lắp chặt cứng trên bệ máy bê tông", "Quạt được nối mền với các đường ống gió", "Tất cả biện pháp trên"], "correct": 2}, {"n": 28, "q": "Đối với phòng hoặc cabin có chứa phần tử gia nhiệt sinh hơi trong nhà ở, các khu vực cấp điện đặc biệt được chia thành các vùng nào sau đây theo mức độ nguy hiểm về điện ?", "opts": ["Vùng 1, 2", "Vùng 1, 2, 3", "Vùng 0, 1, 2, 3", "Vùng 2, 3"], "correct": 1}, {"n": 29, "q": "VRV nghĩa là gì ?", "opts": ["Variable Refrigerant Volume;", "Variable Refrigerated Valve;", "Variable Refrigeration Value;", "Valid Refrigerant Valence."], "correct": 0}, {"n": 30, "q": "Trong hệ thống điều hòa không khí, một chiller có chỉ số hiệu quả năng lượng COP bằng 5 sinh ra 1750 kW
