const DATA=[{"n": 1, "q": "Vùng phục vụ cấp nước:", "opts": ["Một đơn vị cấp nước chỉ được có một vùng phục vụ cấp nước, mỗi vùng phục vụ cấp nước chỉ do một đơn vị cấp nước thực hiện dịch vụ cấp nước", "Một đơn vị cấp nước có thể có nhiều vùng phục vụ cấp nước khác nhau, mỗi vùng phục vụ cấp nước có thể có nhiều đơn vị cấp nước thực hiện dịch vụ cấp nước", "Một đơn vị cấp nước có thể có một hoặc nhiều vùng phục vụ cấp nước khác nhau, mỗi vùng phục vụ cấp nước chỉ do một đơn vị cấp nước thực hiện dịch vụ cấp nước", "Một đơn vị cấp nước có thể có một hoặc nhiều vùng phục vụ cấp nước khác nhau, mỗi vùng phục vụ cấp nước có thể có nhiều đơn vị cấp nước thực hiện dịch vụ cấp nước"], "correct": 2}, {"n": 2, "q": "Dự án đầu tư xây dựng tuyến ống cấp nước có đường kính trong 1000mm với tổng chiều dài tuyến ống là 3.100m, cấp công trình của tuyến ống cấp nước là cấp nào?", "opts": ["Cấp I", "Cấp II", "Cấp III", "Cấp IV"], "correct": 0}, {"n": 3, "q": "Dự án đầu tư xây dựng tuyến cống nước thải, cống riêng có đường kính trong 1200mm với tổng chiều dài tuyến cống là 3.100m, cấp công trình của tuyến cống thoát nước là cấp nào?", "opts": ["Cấp I", "Cấp II", "Cấp III", "Cấp IV"], "correct": 0}, {"n": 4, "q": "Khi lựa chọn dây chuyền công nghệ xử lý nước cấp cho đô thị, bên cạnh các tiêu chí về thành phần tính chất của nước thô, công suất của trạm cấp nước, yêu cầu chất lượng nước cấp cho sinh hoạt theo quy định, cần căn cứ vào các tiêu chí nào khác?", "opts": ["Yêu cầu tiết kiệm diện tích.", "Yêu cầu tiết kiệm diện tích, chi phí đầu tư và vận hành.", "Yêu cầu tiết kiệm năng lượng.", "Yêu cầu tiết kiệm diện tích và năng lượng."], "correct": 2}, {"n": 5, "q": "Trong dây chuyền công nghệ khử sắt trong nước, khi nào phải sử dụng bể lắng tiếp xúc?", "opts": ["Khi hàm lượng cặn lớn nhất sau làm thoáng nhỏ hơn 15 mg/l", "Khi hàm lượng cặn lớn nhất sau làm thoáng lớn hơn 15 mg/l", "Khi hàm lượng cặn lớn nhất sau làm thoáng nhỏ hơn 20 mg/l", "Khi hàm lượng cặn lớn nhất sau làm thoáng lớn hơn 20 mg/l"], "correct": 3}, {"n": 6, "q": "Diện tích tối thiểu khu đất xây dựng trạm xử lý nước công suất từ 60.000-120.000 m3/ngđ được dự báo trong quy hoạch cấp nước là bao nhiêu ha?", "opts": ["3 ha", "4 ha", "5 ha", "6 ha"], "correct": 1}, {"n": 7, "q": "Trạm bơm cấp I bơm nước mặt có phân đợt xây dựng thì phân đợt như thế nào?", "opts": ["Phần nhà trạm được xây cho từng giai đoạn, phần thiết bị lắp đặt phù hợp với từng giai đoạn.", "Phần nhà trạm được xây cho hai giai đoạn ngay từ đợt đầu, phần thiết bị lắp đặt phù hợp với từng giai đoạn.", "Phần nhà trạm được xây cho hai giai đoạn ngay từ đợt đầu, phần thiết bị lắp đặt cho cả hai giai đoạn.", "Phần nhà trạm xây cho từng giai đoạn, phần thiết bị lắp đặt phù hợp với từng giai đoạn."], "correct": 1}, {"n": 8, "q": "Trong dây chuyền công nghệ xử lý nước cấp, phải bố trí ngăn tách khí khi sử dụng công trình nào?", "opts": ["Bể tạo bông có lớp cặn lơ lửng, bể lắng đứng, bể lắng trong có tầng cặn lơ lửng,", "Bể tạo bông kiểu vách ngăn, bể lắng trong có tầng cặn lơ lửng, bể lọc tiếp xúc,", "Bể tạo bông có lớp cặn lơ lửng, bể lắng trong có tầng cặn lơ lửng, bể lọc tiếp xúc", "Bể tạo bông kiểu vách ngăn, Bể tạo bông có lớp cặn lơ lửng, bể lắng trong có tầng cặn lơ lửng"], "correct": 2}, {"n": 9, "q": "Trong trạm định lượng Clo, phải thiết kế hệ thống thông gió cơ khí hoạt động thường xuyên với số lần thay đổi không khí là bao nhiêu lần trong 1 giờ.", "opts": ["4 lần/h", "6 lần/h", "10 lần/h", "12 lần/h"], "correct": 1}, {"n": 10, "q": "Độ sâu đặt ống cấp nước dưới đất (tính từ mặt đất đến đỉnh ống) được quy định như thế nào?", "opts": ["Khi D ≤ 300 mm: không nhỏ hơn 0,6 m; khi D > 300 mm: không nhỏ hơn 1,0 m.", "Khi D ≤ 300 mm: không nhỏ hơn 0,7 m; khi D > 300 mm: không nhỏ hơn 1,0 m.", "Khi D ≤ 300 mm: không nhỏ hơn 0,8 m; khi D > 300 mm: không nhỏ hơn 1,0 m."], "correct": 1}, {"n": 11, "q": "Trong thiết kế mạng lưới cấp nước đô thị, đối với mạng lưới xây mới hoàn toàn, áp lực tối thiểu cần thiết tại các điểm nút ch
