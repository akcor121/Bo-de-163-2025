:root{--bg:#f4f6fa;--fg:#17253b;--card:#fff;--line:#dbe2ed;--blue:#2563eb}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 system-ui,Arial}header{background:#10233f;color:white;padding:22px max(18px,calc((100vw - 950px)/2))}h1{font-size:1.5rem;margin:0 0 6px}main{max-width:950px;margin:22px auto;padding:0 14px}.toolbar{background:white;border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:2}button,select{border:1px solid #b6c5dc;background:white;border-radius:8px;padding:9px 12px;cursor:pointer;font:inherit}button.primary{background:var(--blue);color:white;border-color:var(--blue)}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:14px 0;padding:18px}.question{font-weight:650;margin:0 0 12px}.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);padding:10px 12px;border-radius:8px;margin:7px 0;cursor:pointer;white-space:normal}.opt input{margin-top:5px;flex:none}.opt.good{background:#e6f7ed;border-color:#44a46b}.opt.bad{background:#fff0f0;border-color:#d66}.feedback{font-weight:600;margin-top:10px}.small{opacity:.8;font-size:.9rem}@media(max-width:600px){header{padding:18px}.toolbar{position:static}}</style></head><body><header><h1>Ôn tập Hệ thống cấp – thoát nước công trình</h1><div>51 câu hỏi · Đáp án theo tài liệu PDF gốc</div></header><main><div class="toolbar"><b id="stats"></b><select id="filter"><option value="all">Tất cả câu hỏi</option><option value="todo">Chưa làm</option><option value="wrong">Làm sai</option></select><button id="shuffle">Đảo câu hỏi và đáp án</button><button id="reset">Làm lại</button></div><div id="questions"></div><p class="small">Tiến độ lưu trên trình duyệt. Đáp án giữ nguyên theo tài liệu nguồn, chưa đối chiếu quy chuẩn mới.</p></main><script>
const DATA=[{"n": 1, "q": "Thế nào là tiêu chuẩn cấp nước sinh hoạt tính theo đầu người một ngày đêm?", "opts": ["Là lượng nước cấp lớn nhất của một người có sử dụng hệ thống cấp nước trong một ngày đêm.", "Là lượng nước cấp trung bình của một người có sử dụng hệ thống cấp nước trong một ngày đêm.", "Là lượng nước cấp bé nhất của một người có sử dụng hệ thống cấp nước trong một ngày đêm.", "Là lượng nước cấp lớn nhất một người sử dụng trong một ngày đêm."], "correct": 1}, {"n": 2, "q": "Khi thiết kế thoát nước cho các đô thị, khu dân cư tập trung khu công nghiệp hoặc cụm công nghiệp, cho phép cho phép sử dụng các kiểu hệ thống thoát nước:", "opts": ["Hệ thống thoát nước chung", "Hệ thống thoát nước riêng", "Hệ thống thoát nước chân không", "Cả 3 loại hệ thống thoát nước trên"], "correct": 3}, {"n": 3, "q": "Các loại công trình điều hòa và làm chậm dòng chảy nước mưa?", "opts": ["Bể chứa nước mưa.", "Hồ chứa, hồ điều hòa.", "Các khu đất trũng trong các vườn cây, bãi cỏ… có thể chứa tạm thời trong khi mưa", "Cả 3 đáp án a, b, c"], "correct": 3}, {"n": 4, "q": "Khi thiết kế giếng khoan khai thác nước dưới đất, yêu cầu giếng phải cách xa các công trình kiến trúc tối thiểu?", "opts": ["20 m", "25 m", "30 m", "50 m"], "correct": 1}, {"n": 5, "q": "Khi nào thì làm giếng chuyển bậc trên hệ thống thoát nước ngoài nhà?", "opts": ["Chuyển nước thải, nước mưa xuống cống có độ sâu lớn hơn.", "Đảm bảo vận tốc dòng chảy trong cống không vượt quá giới hạn cho phép hoặc để tránh thay đổi đột ngột tốc độ dòng chảy.", "Khi tránh các công trình ngầm và xả theo phương pháp xả ngập.", "Gồm cả 3 đáp án a,b,c."], "correct": 3}, {"n": 6, "q": "Bậc tin cậy của hệ thống cấp nước phụ thuộc vào", "opts": ["Lưu lượng cấp nước lớn nhất ngày đêm của khu vực cấp nước", "Cấp đô thị của khu vực cấp nước", "Số dân của khu vực cấp nước", "Mức độ quan trọng của các đối tượng dùng nước"], "correct": 2}, {"n": 7, "q": "Đối với đô thị, khi tính đến mức độ đấu nối nước thải vào hệ thống thoát nước tập trung, lưu lượng tính toán nước thải sinh hoạt Qsh (L/s), có thể lấy bằng bao nhiêu % lưu lượng nước cấp sinh hoạt?", "opts": ["60%", "80%", "100%", "Từ 80 đến 100%"], "correct": 3}, {"n": 8, "q": "Áp lực tự do nhỏ nhất trong mạng lưới cấp nước sinh hoạt của khu dân cư, tại điểm lấy nước vào nhà, tính từ mặt đất không được nhỏ hơn?", "opts": ["5 m", "10 m.", "15 m", "20 m"], "correct": 1}, {"n": 9, "q": "Tính toán thủy lực mạng lưới cấp nước bên trong theo:", "opts": ["Lưu lượng trung bình trong một giây.", "Lưu lượng lớn nhất trong một giây.", "Lưu lượng trung bình trong một giờ.", "Lưu lượng lớn nhất trong một giờ."], "correct": 1}, {"n": 10, "q": "Khái niệm nguồn tiếp nhận nước thải:", "opts": ["Là nguồn nước mặt hoặc vùng nước biển ven bờ, có mục đích sử dụng xác định, nơi mà nước thải sinh hoạt thải vào.", "Là sông, hồ.", "Là hệ thống cống, rãnh thoát nước thải.", "Là hệ thống kênh, mương thủy lợi."], "correct": 0}, {"n": 11, "q": "Khi nào thì có thể thiết kế kết hợp hệ thống cấp nước sinh hoạt và hệ thống cấp nước chữa cháy trong công trình?", "opts": ["Khi thỏa mãn các yêu cầu về tiêu chuẩn cấp nước sinh hoạt hiện hành.", "Khi thỏa mãn các yêu cầu về tiêu chuẩn cấp nước chữa cháy hiện hành.", "Khi thỏa mãn các yêu cầu về tiêu chuẩn PCCC và tiêu chuẩn về cấp nước sinh hoạt hiện hành.", "Không thể thiết kế kết hợp hai hệ thống này."], "correct": 2}, {"n": 12, "q": "Tiêu chuẩn nước cấp cho cán bộ trụ sở cơ quan hành chính là:", "opts": ["10-15 l/người.ngày.", "20-25 l/người.ngày.", "25-40 l/người.ngày.", "75-100 l/người.ngày."], "correct": 0}, {"n": 13, "q": "Độ đầy (h/d) lớn nhất cho phép của ống thoát nước thải trong nhà phụ thuộc vào đường kính ống nhưng không nhỏ hơn:", "opts": ["0,4.", "0,5.", "0,6.", "0,75."], "correct": 1}, {"n": 14, "q": "Khi nào thì làm giếng thăm trên hệ thống thoát nước ngoài nhà?", "opts": ["Khi có sự chuyển hướng tuyến cống, và có sự đấu nối các tuyến cống khác.", "Khi có sự thay đổi đường kính cống.", "Khi chiều dài đoạn cống dài hơn tiêu chuẩn cho phép.", "Gồm cả 3 đáp án a,b,c."], "correct": 3}, {"n": 15, "q": "Sử dụng van giảm áp nhằm mục đích gì?", "opts": ["Đảm bảo áp lực trong đường ống không vượt quá mức cho phép.", "Đảm bảo áp lực tại các dụng cụ vệ sinh không vượt quá mức cho phép.", "Cân bằng lưu lượng tiêu thụ thực tế cho các dụng cụ dùng nước.", "Gồm cả 3 đáp án a, b, c."], "correct": 3}, {"n": 16, "q": "Áp lực tự do cần thiết ở các thiết bị sản xuất là bao nhiêu?", "opts": ["1 m;", "3 m;", "4 m;", "Tùy thuộc vào đặc trưng công nghệ của thiết bị đó."], "correct": 3}, {"n": 17, "q": "Vận tốc lớn nhất của dòng nước thải trong cống bằng kim loại:", "opts": ["Không quá 2 m/s.", "Không quá 4 m/s.", "Không quá 8 m/s.", "Không quá 10 m/s."], "correct": 2}, {"n": 18, "q": "Vận tốc lớn nhất của dòng nước thải trong cống phi kim loại:", "opts": ["Không quá 2 m/s.", "Không quá 4 m/s.", "Không quá 6 m/s.", "Không quá 8 m/s."], "correct": 1}, {"n": 19, "q": "Bể điều hòa nước thải là:", "opts": ["Công trình để điều hòa sự dao động về lưu lượng của nước thải.", "Công trình để điều hòa sự dao động về nồng độ các chất bẩn của nước thải.", "Công trình để điều hòa sự dao động về lưu lượng của nước thải, nồng độ các chất bẩn hoặc nhiệt độ của nước thải.", "Công trình để loại bỏ các chất lơ lửng có trong nước thải."], "correct": 2}, {"n": 20, "q": "Lưu lượng thực tế chảy ra ở các vòi nước trong nhà phụ thuộc vào:", "opts": ["Áp lực nước tại vòi.", "Kích thước lỗ của vòi.", "Gồm đáp án a và b.", "Đương lượng tính toán của vòi."], "correct": 2}, {"n": 21, "q": "Áp lực nước lớn nhất tại dụng cụ vệ sinh của hệ thống cấp nước trong nhà lớn nhất khi nào?", "opts": ["Khi tất cả các dụng cụ vệ sinh đều sử dụng.", "Khi áp lực nước điểm đầu mạng lưới lớn nhất.", "Khi tất cả các dụng cụ vệ sinh không sử dụng.", "Khi áp lực nước điểm đầu mạng lớn nhất và tất cả các dụng cụ vệ sinh không sử dụng nước."], "correct": 3}, {"n": 22, "q": "Trong trường hợp nào thì được phép hút nước trực tiếp từ mạng lưới cấp bên ngoài để cấp nước trực tiếp đến các thiết bị vệ sinh trong công trình?", "opts": ["Khi ống cấp nước bên ngoài công trình không đủ áp lực cấp trực tiếp cho cho các thiết bị vệ sinh trong công trình.", "Khi ống cấp nước bên ngoài công trình lớn hơn đường ống cấp nước vào công trình.", "Khi ống cấp nước bên ngoài công trình lớn hơn tối thiểu 3 lần đường ống cấp nước vào công trình.", "Cả 3 trường hợp đều không được phép."], "correct": 3}, {"n": 23, "q": "Bùn hoạt tính là:", "opts": ["Bùn thu được từ các bể lắng trong dây chuyền xử lý nước thải.", "Bùn thu được từ các bể lọc trong dây chuyền xử lý nước thải.", "Bùn chứa các vi sinh vật trong nước thải.", "Bùn chứa các vi sinh vật có khả năng hấp thụ và phân hủy các chất bẩn trong nước thải."], "correct": 3}, {"n": 24, "q": "Việc nghiệm thu hệ thống cấp nước bên trong công trình được tiến hành khi:", "opts": ["Lắp đặt xong hệ thống.", "Có kết quả thử áp lực.", "Có kết quả thử áp lực và kiểm tra bên ngoài.", "Có kết quả thử áp lực, kiểm tra bên ngoài và kiểm tra sự hoạt động của hệ thống."], "correct": 3}, {"n": 25, "q": "Đường kính nhỏ nhất của đường ống thoát nước thải sinh hoạt tiểu khu là:", "opts": ["100mm.", "150mm.", "200mm.", "300mm."], "correct": 1}, {"n": 26, "q": "Đường kính nhỏ nhất của đường ống thoát nước mưa tiểu khu là:", "opts": ["150mm.", "200mm.", "300mm.", "400mm."], "correct": 1}, {"n": 27, "q": "Độ sâu đặt cống tối thiểu tính từ đỉnh cống ở chỗ có xe cơ giới qua lại là:", "opts": ["0,5m.", "0,7m.", "0,8m.", "0,9m."], "correct": 0}, {"n": 28, "q": "Tiêu chuẩn nước rửa mặt đường và quảng trường đã hoàn thiện trong khu dân cư và khu công nghiệp bằng cơ giới cho 1 lần rửa là:", "opts": ["0,5-0,8 l/m2.", "0,8-1,0 l/m2.", "1,2-1,5 l/m2.", "Không xác định."], "correct": 2}, {"n": 29, "q": "Thế nào là tiêu chuẩn thoát nước sinh hoạt theo ngày đêm?", "opts": ["Là lượng nước thải lớn nhất của một người có sử dụng hệ thống thoát nước trong một ngày đêm.", "Là lượng nước thải trung bình của một người có sử dụng hệ thống thoát nước trong một ngày đêm.", "Là lượng nước thải bé nhất của một người có sử dụng hệ thống thoát nước trong một ngày đêm.", "Là lượng nước cấp lớn nhất một người sử dụng trong một ngày đêm."], "correct": 1}, {"n": 30, "q": "Áp lực nước lớn nhất tại dụng cụ vệ sinh của hệ thống cấp nước trong nhà lớn nhất khi nào?", "opts": ["Khi tất cả các dụng cụ vệ sinh đều sử dụng.", "Khi áp lực nước điểm đầu mạng lưới lớn nhất.", "Khi tất cả các dụng cụ vệ sinh không sử dụng.", "Khi áp lực nước điểm đầu mạng lớn nhất và tất cả các dụng cụ vệ sinh không sử dụng nước."], "correct": 3}, {"n": 31, "q": "Chiều dài tối đa của đường ống kể từ ống đứng thoát nước hay ống thông tắc đến tâm giếng thăm là:", "opts": ["4 m.", "8 m.", "12 m.", "Không quy định."], "correct": 1}, {"n": 32, "q": "Đường kính ống thoát nước trong nhà nối với hệ thống thoát nước bên ngoài không nhỏ hơn:", "opts": ["100 mm.", "150 mm.", "200 mm.", "Đường kính ống đứng lớn nhất nối vào ống này."], "correct": 3}, {"n": 33, "q": "Ống hút của máy bơm nước thải:", "opts": ["Cần đặt ngang với cốt trục máy bơm.", "Cần đặt dốc hướng về máy bơm với độ dốc không nhỏ hơn 0,001.", "Cần đặt dốc hướng về máy bơm với độ dốc không nhỏ hơn 0,005.", "Cần đặt dốc hướng về máy bơm với độ dốc không nhỏ hơn 0,01."], "correct": 2}, {"n": 34, "q": "Đường kính của mỗi trục ống đứng thoát nước:", "opts": ["Thay đổi theo lưu lượng tính toán của mỗi tầng.", "Không thay đổi theo cả chiều cao của ống.", "Thay đổi theo số lượng ống nhánh đấu nối vào.", "Thay đổi theo chiều cao công trình."], "correct": 1}, {"n": 35, "q": "Hệ số dùng nước không điều hòa ngày là:", "opts": ["Tỷ số giữa ngày dùng nước lớn nhất và ngày dùng nước nhỏ nhất trong năm.", "Tỷ số giữa ngày dùng nước lớn nhất và ngày dùng nước trung bình trong năm.", "Tỷ số giữa ngày dùng nước ngày nhỏ nhất và ngày dùng nước trung bình trong năm.", "Tỷ số giữa ngày dùng nước nhỏ nhất và ngày dùng nước lớn nhất trong năm."], "correct": 1}, {"n": 36, "q": "Hệ số dùng nước không điều hòa giờ là:", "opts": ["Tỷ số giữa giờ dùng nước lớn nhất và giờ dùng nước nhỏ nhất trong ngày.", "Tỷ số giữa giờ dùng nước nhỏ nhất và giờ dùng nước lớn nhất trong ngày.", "Tỷ số giữa giờ dùng nước lớn nhất và giờ dùng nước trung bình trong ngày.", "Tỷ số giữa giờ dùng nước nhỏ nhất và giờ dùng nước trung bình trong ngày."], "correct": 2}, {"n": 37, "q": "Lượng nước bổ sung cho bể bơi trong ngày đêm được tính:", "opts": ["Bằng 5% dung tích bể bơi.", "Bằng 10% dung tích bể bơi.", "Bằng 15% dung tích bể bơi.", "Bằng 20% dung tích bể bơi."], "correct": 1}, {"n": 38, "q": "Tiêu chuẩn thoát nước thải sinh hoạt được lấy theo:", "opts": ["Tiêu chuẩn dùng nước.", "Tiêu chuẩn thoát nước riêng.", "Thực tế sử dụng.", "Đương lượng của thiết bị vệ sinh."], "correct": 0}, {"n": 39, "q": "Độ dốc tối thiểu của ống nhánh thoát nước hướng về ống đứng là:", "opts": ["1%.", "2%.", "3%.", "4%."], "correct": 0}, {"n": 40, "q": "Hệ thống cấp nước bên trong công trình có nhiệm vụ:", "opts": ["Thu nước thô từ nguồn nước thiên nhiên, xử lý nước đạt tiêu chuẩn tiêu dùng, truyền dẫn và phân phối nước đến các đối tượng tiêu thụ.", "Truyền dẫn nước đạt tiêu chuẩn đến nơi tiêu thụ.", "Đưa nước từ mạng lưới cấp nước bên ngoài đến mọi thiết bị, dụng cụ vệ sinh, thiết bị chữa cháy hoặc máy móc sản xuất.", "Gồm cả 3 đáp án a, b, c."], "correct": 2}, {"n": 41, "q": "Các bộ phận chính của hệ thống cấp nước trong công trình bao gồm:", "opts": ["Đường ống dẫn nước vào nhà, bể chứa, trạm bơm.", "Đồng hồ đo nước, đường ống chính.", "Đường ống đứng, đường ống nhánh và các thiết bị dùng nước.", "Gồm cả 3 đáp án a, b, c."], "correct": 3}, {"n": 42, "q": "Ống thông hơi phụ trên ống nhánh của mạng lưới thoát nước bên trong công trình có chức năng:", "opts": ["Thông hơi.", "Điều áp.", "Thông hơi và điều áp.", "Thu gom nước thải."], "correct": 2}, {"n": 43, "q": "Quy định áp lực nước làm việc lớn nhất cho phép tại các dụng cụ vệ sinh trong hệ thống cấp nước bên trong nhà để:", "opts": ["Bảo vệ đường ống.", "Bảo vệ dụng cụ vệ sinh.", "Tiện nghi cho sử dụng.", "Gồm cả 3 đáp án a, b, c."], "correct": 3}, {"n": 44, "q": "Áp lực tự do nhỏ nhất trong mạng lưới cấp nước sinh hoạt khu dân cư tại điểm cấp nước vào nhà, tính từ mặt đất là:", "opts": ["10m.", "Không nhỏ hơn 10m.", "Lớn hơn 18m.", "Không quy định."], "correct": 1}, {"n": 45, "q": "Bậc tin cậy của trạm bơm cấp nước sinh hoạt được phân thành:", "opts": ["1 loại.", "2 loại.", "3 loại.", "Không xác định."], "correct": 2}, {"n": 46, "q": "Phương pháp và mức độ xử lý nước thải phụ thuộc vào:", "opts": ["Lưu lượng, thành phần, tính chất của nước thải.", "Đặc điểm của nguồn tiếp nhận và các yêu cầu vệ sinh khi xả nước thải vào nguồn.", "Các điều kiện cụ thể của địa phương.", "Cả 3 đáp án a, b, c."], "correct": 3}, {"n": 47, "q": "Ống đứng thông hơi cao hơn mái nhà:", "opts": ["0,5 m.", "0,7 m.", "1,0 m.", "1,5 m."], "correct": 1}, {"n": 48, "q": "Trên đường ống đẩy của mỗi máy bơm cấp nước cần phải có:", "opts": ["Van (khóa).", "Van một chiều.", "Đồng hồ đo áp.", "Cả 3 đáp án a, b, c."], "correct": 3}, {"n": 49, "q": "Lắp đặt đồng hồ đo nước kiểu cánh quạt theo hướng:", "opts": ["Đặt nằm ngang.", "Đặt xiên.", "Đặt thẳng đứng.", "Không quy định."], "correct": 0}, {"n": 50, "q": "Đường ống xả nối với đường ống thoát nước bên ngoài phải tạo một góc (theo chiều nước chảy) không nhỏ hơn:", "opts": ["30o.", "60o.", "90o.", "Không quy định."], "correct": 2}, {"n": 51, "q": "Cần phải thiết kế trạm bơm nước thải cho công trình khi:", "opts": ["Lưu lượng nước thải của công trình lớn.", "Công trình có xây dựng tầng hầm.", "Khi toàn bộ nước thải của công trình không thể tự chảy ra hệ thống thoát nước bên ngoài.", "Khi bên ngoài không thiết kế trạm bơm thoát nước."], "correct": 2}];const key='quiz_Quiz_CTN.html';let saved={};try{saved=JSON.parse(localStorage.getItem(key)||'{}')}catch(e){}let order=DATA.map((_,i)=>i), perms={};
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function reshuffle(){order=shuffle(DATA.map((_,i)=>i));perms={};DATA.forEach(q=>perms[q.n]=shuffle([0,1,2,3]));render()}
function render(){let correct=0,done=0;DATA.forEach(q=>{if(saved[q.n]!==undefined){done++;if(saved[q.n]===q.correct)correct++}});document.getElementById('stats').textContent=`Đã làm: ${done}/${DATA.length} · Đúng: ${correct} · Sai: ${done-correct}`;const filter=document.getElementById('filter').value;let root=document.getElementById('questions');root.replaceChildren();for(const idx of order){const q=DATA[idx],choice=saved[q.n],answered=choice!==undefined;if(filter==='todo'&&answered||filter==='wrong'&&(!answered||choice===q.correct))continue;let card=document.createElement('article');card.className='card';let p=document.createElement('p');p.className='question';p.textContent=`Câu ${q.n}. ${q.q}`;card.append(p);(perms[q.n]||[0,1,2,3]).forEach((orig,i)=>{let lab=document.createElement('label');lab.className='opt'+(answered&&orig===q.correct?' good':'')+(answered&&choice===orig&&choice!==q.correct?' bad':'');let inp=document.createElement('input');inp.type='radio';inp.name='q'+q.n;inp.checked=choice===orig;inp.disabled=answered;inp.onchange=()=>{saved[q.n]=orig;localStorage.setItem(key,JSON.stringify(saved));render()};let t=document.createElement('span');t.textContent=String.fromCharCode(65+i)+'. '+q.opts[orig];lab.append(inp,t);card.append(lab)});if(answered){let msg=document.createElement('div');msg.className='feedback';msg.textContent=(choice===q.correct?'✓ Chính xác. ':'✗ Chưa đúng. ')+`Đáp án: ${String.fromCharCode(65+(perms[q.n]||[0,1,2,3]).indexOf(q.correct))}`;card.append(msg)}root.append(card)}}
document.getElementById('filter').onchange=render;document.getElementById('shuffle').onclick=reshuffle;document.getElementById('reset').onclick=()=>{if(confirm('Xóa toàn bộ kết quả đã làm?')){saved={};localStorage.removeItem(key);render()}};reshuffle();</script></body></html>
